<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Execution Alerts — CyberGroupmate Dashboard</title>
  <link rel="icon" type="image/png" href="/kissheart.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: #0f1117;
      color: #e1e4e8;
      padding: 24px;
      min-height: 100vh;
    }
    .app { max-width: 1400px; margin: 0 auto; }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    h1 i { color: #58a6ff; }
    .subtitle { color: #8b949e; font-size: 0.85rem; margin-bottom: 24px; }
    a.back { color: #58a6ff; text-decoration: none; font-size: 0.85rem; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
    }
    .filters label { font-size: 0.8rem; color: #8b949e; }
    .filters select {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e1e4e8;
      padding: 6px 12px;
      font-size: 0.85rem;
      outline: none;
    }
    .filters select:focus { border-color: #58a6ff; }
    .filters .btn {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      padding: 6px 16px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .filters .btn:hover { background: #30363d; }

    .section {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #1c2128;
      border-bottom: 1px solid #30363d;
    }
    .section-header h2 { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    th {
      text-align: left;
      padding: 8px 10px;
      background: #1c2128;
      border-bottom: 1px solid #30363d;
      color: #8b949e;
      font-weight: 600;
      white-space: nowrap;
    }
    td {
      padding: 8px 10px;
      border-bottom: 1px solid #21262d;
      vertical-align: middle;
    }
    tr:hover td { background: #1c2128; }
    tr.clickable { cursor: pointer; }

    .severity-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .severity-critical { background: #3d1f2f; color: #ff7b72; }
    .severity-high     { background: #3d2a1f; color: #d29922; }
    .severity-medium   { background: #1f3a2f; color: #7ee787; }
    .severity-low      { background: #1f2a3f; color: #79c0ff; }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .status-active       { background: #f85149; }
    .status-acknowledged { background: #d29922; }
    .status-resolved     { background: #3fb950; }

    .rule-tag {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 500;
      background: #21262d;
      color: #8b949e;
    }

    .loading { text-align: center; padding: 40px; color: #8b949e; }
    .loading i { font-size: 1.5rem; }
    .empty { text-align: center; padding: 40px; color: #8b949e; }
    .empty i { font-size: 2rem; display: block; margin-bottom: 8px; }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 12px;
    }
    .pagination button {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      padding: 6px 14px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Detail Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.visible { display: flex; }
    .modal {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      max-width: 700px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .modal-header h3 { font-size: 1.1rem; }
    .modal-close {
      background: none;
      border: none;
      color: #8b949e;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .modal-close:hover { color: #f85149; }
    .modal-section { margin-bottom: 16px; }
    .modal-section h4 {
      font-size: 0.85rem;
      color: #58a6ff;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .modal-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.82rem;
    }
    .modal-info-grid .label { color: #8b949e; }
    .modal-info-grid .value { color: #e1e4e8; font-family: monospace; font-size: 0.8rem; }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
    .modal-actions button {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #30363d;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-acknowledge { background: #1f3a5f; color: #79c0ff; }
    .btn-resolve     { background: #1f3d2f; color: #7ee787; }
    .btn-acknowledge:hover { background: #2a4a7a; }
    .btn-resolve:hover     { background: #2a4d3a; }

    .trace-preview {
      font-family: monospace;
      font-size: 0.75rem;
      color: #8b949e;
      background: #0f1117;
      padding: 8px;
      border-radius: 6px;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    @media (max-width: 768px) {
      body { padding: 12px; }
      .filters { flex-direction: column; }
      .modal-info-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <a class="back" href="/">&larr; Dashboard</a>
    <h1><i class="fas fa-bell"></i> Execution Alerts</h1>
    <p class="subtitle">Active anomalies, failures, and performance warnings</p>

    <div class="filters">
      <label>Status
        <select id="filter-status">
          <option value="">all</option>
          <option value="active">active</option>
          <option value="acknowledged">acknowledged</option>
          <option value="resolved">resolved</option>
        </select>
      </label>
      <label>Severity
        <select id="filter-severity">
          <option value="">all</option>
          <option value="critical">critical</option>
          <option value="high">high</option>
          <option value="medium">medium</option>
          <option value="low">low</option>
        </select>
      </label>
      <button class="btn" onclick="loadAlerts()"><i class="fas fa-sync"></i> Refresh</button>
      <span id="count-badge" style="color:#8b949e;font-size:0.82rem;margin-left:auto;"></span>
    </div>

    <div class="section">
      <div class="section-header">
        <h2><i class="fas fa-list"></i> Alerts</h2>
        <span id="alert-count" style="font-size:0.8rem;color:#8b949e"></span>
      </div>
      <table>
        <thead>
          <tr>
            <th>Severity</th>
            <th>Rule</th>
            <th>Source</th>
            <th>Message</th>
            <th>Occurrences</th>
            <th>Status</th>
            <th>Last Seen</th>
          </tr>
        </thead>
        <tbody id="alerts-body">
          <tr><td colspan="7" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>
        </tbody>
      </table>
      <div class="pagination" id="pagination">
        <button id="prev-btn" onclick="prevPage()" disabled><i class="fas fa-chevron-left"></i></button>
        <span id="page-info" style="color:#8b949e;font-size:0.82rem"></span>
        <button id="next-btn" onclick="nextPage()"><i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Alert Detail</h3>
        <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    const PAGE_SIZE = 25;
    let alerts = [];
    let currentPage = 0;

    function getToken() {
      const u = new URL(window.location.href);
      return u.searchParams.get('token') || '';
    }
    function apiUrl(path) {
      const t = getToken();
      return path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(t);
    }
    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function loadAlerts() {
      const tb = document.getElementById('alerts-body');
      tb.innerHTML = '<tr><td colspan="7" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>';

      const status = document.getElementById('filter-status').value;
      const severity = document.getElementById('filter-severity').value;

      let url = '/api/execution-alerts?limit=200';
      if (status) url += '&status=' + encodeURIComponent(status);
      if (severity) url += '&severity=' + encodeURIComponent(severity);

      try {
        const resp = await fetch(apiUrl(url));
        if (!resp.ok) throw new Error(resp.statusText);
        alerts = await resp.json();

        // Also load count
        const countResp = await fetch(apiUrl('/api/execution-alerts/count'));
        if (countResp.ok) {
          const countData = await countResp.json();
          document.getElementById('count-badge').textContent = countData.active + ' active';
        }

        currentPage = 0;
        renderPage();
      } catch (err) {
        tb.innerHTML = '<tr><td colspan="7" class="empty"><i class="fas fa-exclamation-triangle"></i>Failed: ' + escapeHtml(err.message) + '</td></tr>';
      }
    }

    function renderPage() {
      const tb = document.getElementById('alerts-body');
      const total = alerts.length;
      const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
      if (currentPage >= totalPages) currentPage = totalPages - 1;
      const start = currentPage * PAGE_SIZE;
      const end = Math.min(start + PAGE_SIZE, total);
      const page = alerts.slice(start, end);

      document.getElementById('page-info').textContent = totalPages > 1 ? (currentPage + 1) + '/' + totalPages : '';
      document.getElementById('prev-btn').disabled = currentPage <= 0;
      document.getElementById('next-btn').disabled = currentPage >= totalPages - 1;

      if (page.length === 0) {
        tb.innerHTML = '<tr><td colspan="7" class="empty"><i class="fas fa-check-circle" style="color:#3fb950"></i>No alerts</td></tr>';
        return;
      }

      tb.innerHTML = page.map(a => {
        const sevClass = 'severity-' + a.severity;
        const statusClass = 'status-' + a.status;
        const lastSeen = a.lastObservedAtMs ? new Date(a.lastObservedAtMs).toLocaleString('zh-CN', { hour12: false }) : '-';
        const msgShort = a.contextSummary.message.length > 80
          ? escapeHtml(a.contextSummary.message.slice(0, 80)) + '…'
          : escapeHtml(a.contextSummary.message);

        return '<tr class="clickable" onclick="openDetail(\'' + a.alertId + '\')">'
          + '<td><span class="severity-badge ' + sevClass + '">' + escapeHtml(a.severity) + '</span></td>'
          + '<td><span class="rule-tag">' + escapeHtml(a.ruleType) + '</span></td>'
          + '<td style="font-family:monospace;font-size:0.78rem">' + escapeHtml(a.sourceComponent) + '</td>'
          + '<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + escapeHtml(a.contextSummary.message) + '">' + msgShort + '</td>'
          + '<td>' + a.occurrenceCount + '</td>'
          + '<td><span class="status-dot ' + statusClass + '"></span>' + escapeHtml(a.status) + '</td>'
          + '<td style="font-size:0.75rem;color:#8b949e;white-space:nowrap">' + lastSeen + '</td>'
          + '</tr>';
      }).join('');
    }

    function prevPage() { if (currentPage > 0) { currentPage--; renderPage(); } }
    function nextPage() { currentPage++; renderPage(); }

    // ─── Detail Modal ───
    async function openDetail(alertId) {
      const overlay = document.getElementById('modal-overlay');
      overlay.classList.add('visible');
      document.getElementById('modal-title').textContent = 'Alert: ' + alertId.slice(0, 8) + '…';

      let html = '<div class="modal-section"><div class="modal-info-grid">';

      try {
        const resp = await fetch(apiUrl('/api/execution-alerts/' + encodeURIComponent(alertId) + '/context'));
        if (!resp.ok) throw new Error('Failed to load context');

        const ctx = await resp.json();
        html += '<div><span class="label">Rule</span><br><span class="value">' + escapeHtml(ctx.ruleType) + '</span></div>';
        html += '<div><span class="label">Severity</span><br><span class="value">' + escapeHtml(ctx.severity) + '</span></div>';
        html += '<div><span class="label">Status</span><br><span class="value">' + escapeHtml(ctx.status) + '</span></div>';
        html += '<div><span class="label">Source</span><br><span class="value">' + escapeHtml(ctx.sourceComponent) + '</span></div>';
        html += '<div><span class="label">Occurrences</span><br><span class="value">' + ctx.occurrenceCount + '</span></div>';
        html += '<div><span class="label">Created</span><br><span class="value">' + escapeHtml(ctx.createdAt || '-') + '</span></div>';
        html += '<div><span class="label">Last Observed</span><br><span class="value">' + escapeHtml(ctx.lastObservedAt || '-') + '</span></div>';
        html += '</div></div>';

        html += '<div class="modal-section"><h4>Message</h4>';
        html += '<p style="font-size:0.85rem;color:#e1e4e8">' + escapeHtml(ctx.contextSummary?.message || '') + '</p>';
        html += '</div>';

        if (ctx.contextSummary?.sampleErrorLogs?.length > 0) {
          html += '<div class="modal-section"><h4>Sample Error Logs</h4>';
          html += '<div class="trace-preview">' + escapeHtml(ctx.contextSummary.sampleErrorLogs.join('\n')) + '</div>';
          html += '</div>';
        }

        if (ctx.contextSummary?.metricsSnapshot) {
          html += '<div class="modal-section"><h4>Metrics Snapshot</h4>';
          html += '<div class="trace-preview">' + escapeHtml(JSON.stringify(ctx.contextSummary.metricsSnapshot, null, 2)) + '</div>';
          html += '</div>';
        }

        if (ctx.relatedExecution) {
          html += '<div class="modal-section"><h4>Related Execution</h4>';
          html += '<div class="modal-info-grid">';
          html += '<div><span class="label">Method</span><br><span class="value">' + escapeHtml(ctx.relatedExecution.method) + '</span></div>';
          html += '<div><span class="label">Status</span><br><span class="value">' + escapeHtml(ctx.relatedExecution.status) + '</span></div>';
          html += '<div><span class="label">Duration</span><br><span class="value">' + (ctx.relatedExecution.durationMs || '-') + 'ms</span></div>';
          if (ctx.relatedExecution.error) {
            html += '<div><span class="label">Error</span><br><span class="value" style="color:#f85149">' + escapeHtml(ctx.relatedExecution.error.type || '') + ': ' + escapeHtml(ctx.relatedExecution.error.message || '') + '</span></div>';
          }
          html += '</div></div>';
        }

        html += '<div class="modal-actions">';
        if (ctx.status === 'active') {
          html += '<button class="btn-acknowledge" onclick="acknowledgeAlert(\'' + alertId + '\')"><i class="fas fa-check"></i> Acknowledge</button>';
        }
        if (ctx.status !== 'resolved') {
          html += '<button class="btn-resolve" onclick="resolveAlert(\'' + alertId + '\')"><i class="fas fa-check-double"></i> Resolve</button>';
        }
        html += '</div>';

      } catch (err) {
        html += '<div style="color:#f85149">Error: ' + escapeHtml(err.message) + '</div>';
      }

      document.getElementById('modal-body').innerHTML = html;
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('visible');
    }

    async function acknowledgeAlert(alertId) {
      try {
        const resp = await fetch(apiUrl('/api/execution-alerts/' + encodeURIComponent(alertId) + '/acknowledge'), { method: 'POST' });
        if (!resp.ok) throw new Error('Failed');
        closeModal();
        loadAlerts();
      } catch (err) {
        alert('Failed to acknowledge: ' + err.message);
      }
    }

    async function resolveAlert(alertId) {
      try {
        const resp = await fetch(apiUrl('/api/execution-alerts/' + encodeURIComponent(alertId) + '/resolve'), { method: 'POST' });
        if (!resp.ok) throw new Error('Failed');
        closeModal();
        loadAlerts();
      } catch (err) {
        alert('Failed to resolve: ' + err.message);
      }
    }

    // Close modal on overlay click
    document.getElementById('modal-overlay').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    loadAlerts();
  </script>
</body>
</html>
