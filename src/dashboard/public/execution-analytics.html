<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Execution Analytics</title> — CyberGroupmate Dashboard</title>
  <link rel="icon" type="image/png" href="/kissheart.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: #0f1117;
      color: #e1e4e8;
      padding: 24px;
      min-height: 100vh;
    }
    .app { max-width: 1400px; margin: 0 auto; }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    h1 i { color: #58a6ff; }
    .subtitle { color: #8b949e; font-size: 0.85rem; margin-bottom: 24px; }
    a.back { color: #58a6ff; text-decoration: none; font-size: 0.85rem; }
    a.back:hover { text-decoration: underline; }

    /* ── Overview Cards ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
    }
    .card .label { font-size: 0.75rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
    .card .value { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }
    .card .value.green  { color: #3fb950; }
    .card .value.red    { color: #f85149; }
    .card .value.blue   { color: #58a6ff; }
    .card .value.orange { color: #d29922; }
    .card .value.purple { color: #bc8cff; }
    .card .value.gray   { color: #8b949e; }

    /* ── Section ── */
    .section {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .section h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section h2 i { color: #58a6ff; }

    /* ── Grid ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* ── Table ── */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    th {
      text-align: left;
      padding: 8px 10px;
      background: #1c2128;
      border-bottom: 1px solid #30363d;
      color: #8b949e;
      font-weight: 600;
      white-space: nowrap;
    }
    td {
      padding: 6px 10px;
      border-bottom: 1px solid #21262d;
    }
    tr:hover td { background: #1c2128; }

    /* ── Bar ── */
    .bar-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bar-bg {
      flex: 1;
      height: 8px;
      background: #1c2128;
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s;
    }
    .bar-fill.green  { background: #3fb950; }
    .bar-fill.red    { background: #f85149; }
    .bar-fill.blue   { background: #58a6ff; }
    .bar-fill.orange { background: #d29922; }
    .bar-fill.purple { background: #bc8cff; }
    .bar-fill.gray   { background: #484f58; }
    .bar-label { white-space: nowrap; font-size: 0.78rem; color: #8b949e; min-width: 40px; text-align: right; }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }

    .loading { text-align: center; padding: 40px; color: #8b949e; }
    .loading i { font-size: 1.5rem; }
    .error-banner {
      background: #3d1f2f;
      border: 1px solid #f85149;
      border-radius: 8px;
      padding: 12px 16px;
      color: #f85149;
      margin-bottom: 16px;
    }

    @media (max-width: 768px) {
      body { padding: 12px; }
      .grid-2 { grid-template-columns: 1fr; }
      .cards { grid-template-columns: repeat(2, 1fr); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .badge-agent    { background: #1f3a5f; color: #79c0ff; }
    .badge-sandbox  { background: #1f3d2f; color: #7ee787; }
    .badge-host_call { background: #3d1f2f; color: #ff7b72; }

    .pct { font-size: 0.75rem; color: #8b949e; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <a class="back" href="/">&larr; Dashboard</a>
    <h1><i class="fas fa-chart-line"></i> Execution Analytics</h1>
    <p class="subtitle">Execution quality, failure analysis, and performance insights</p>

    <div id="error-area"></div>

    <!-- Overview Cards -->
    <div class="cards" id="overview-cards">
      <div class="card"><div class="label">Total</div><div class="value gray" id="stat-total">...</div></div>
      <div class="card"><div class="label">Success Rate</div><div class="value green" id="stat-sr">...</div></div>
      <div class="card"><div class="label">Failures</div><div class="value red" id="stat-failures">...</div></div>
      <div class="card"><div class="label">Avg Duration</div><div class="value blue" id="stat-avg-dur">...</div></div>
      <div class="card"><div class="label">Max Duration</div><div class="value orange" id="stat-max-dur">...</div></div>
      <div class="card"><div class="label">Timed Out</div><div class="value orange" id="stat-timedout">...</div></div>
    </div>

    <div class="grid-2">
      <!-- Status Distribution -->
      <div class="section">
        <h2><i class="fas fa-circle"></i> Status Distribution</h2>
        <div id="status-dist"><div class="loading"><i class="fas fa-spinner fa-spin"></i></div></div>
      </div>

      <!-- Source Analytics -->
      <div class="section">
        <h2><i class="fas fa-cube"></i> By Source</h2>
        <div id="source-analytics"><div class="loading"><i class="fas fa-spinner fa-spin"></i></div></div>
      </div>
    </div>

    <!-- Method Analytics -->
    <div class="section">
      <h2><i class="fas fa-code"></i> By Method</h2>
      <div id="method-analytics"><div class="loading"><i class="fas fa-spinner fa-spin"></i></div></div>
    </div>

    <div class="grid-2">
      <!-- Error Ranking -->
      <div class="section">
        <h2><i class="fas fa-exclamation-triangle"></i> Error Ranking</h2>
        <div id="error-ranking"><div class="loading"><i class="fas fa-spinner fa-spin"></i></div></div>
      </div>

      <!-- Slow Executions -->
      <div class="section">
        <h2><i class="fas fa-hourglass-half"></i> Slow Executions</h2>
        <div id="slow-executions"><div class="loading"><i class="fas fa-spinner fa-spin"></i></div></div>
      </div>
    </div>
  </div>

  <script>
    function getToken() {
      const u = new URL(window.location.href);
      return u.searchParams.get('token') || '';
    }
    function apiUrl(path) {
      const t = getToken();
      return path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(t);
    }
    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function loadAll() {
      document.getElementById('error-area').innerHTML = '';
      try {
        const resp = await fetch(apiUrl('/api/execution-analytics/full'));
        if (!resp.ok) throw new Error(resp.statusText);
        const data = await resp.json();
        renderOverview(data.overview);
        renderStatusDist(data.statusDistribution);
        renderSourceAnalytics(data.bySource);
        renderMethodAnalytics(data.byMethod);
        renderErrorRanking(data.errorRanking);
        renderSlowExecutions(data.slowExecutions);
      } catch (err) {
        document.getElementById('error-area').innerHTML =
          '<div class="error-banner"><i class="fas fa-exclamation-circle"></i> Failed to load analytics: ' + escapeHtml(err.message) + '</div>';
      }
    }

    function renderOverview(o) {
      document.getElementById('stat-total').textContent = o.totalExecutions;
      document.getElementById('stat-sr').textContent = o.successRate + '%';
      document.getElementById('stat-failures').textContent = o.failureCount;
      document.getElementById('stat-avg-dur').textContent = o.avgDurationMs + 'ms';
      document.getElementById('stat-max-dur').textContent = o.maxDurationMs + 'ms';
      document.getElementById('stat-timedout').textContent = o.timedOutCount;
    }

    function renderStatusDist(dist) {
      const total = dist.reduce((s, d) => s + d.count, 0) || 1;
      const colors = {
        success: '#3fb950', failure: '#f85149', interrupted: '#d29922',
        timed_out: '#d29922', policy_denied: '#bc8cff', pending: '#8b949e', running: '#58a6ff',
      };
      let html = '<table><thead><tr><th>Status</th><th>Count</th><th>%</th><th></th></tr></thead><tbody>';
      for (const d of dist) {
        const pct = (d.count / total * 100).toFixed(1);
        const color = colors[d.status] || '#8b949e';
        html += '<tr>'
          + '<td><span class="status-dot" style="background:' + color + '"></span>' + escapeHtml(d.status) + '</td>'
          + '<td>' + d.count + '</td>'
          + '<td class="pct">' + pct + '%</td>'
          + '<td><div class="bar-wrap"><div class="bar-bg"><div class="bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div></div></td>'
          + '</tr>';
      }
      html += '</tbody></table>';
      document.getElementById('status-dist').innerHTML = html;
    }

    function renderSourceAnalytics(sources) {
      if (!sources || sources.length === 0) {
        document.getElementById('source-analytics').innerHTML = '<div style="color:#8b949e;padding:20px;text-align:center">No data</div>';
        return;
      }
      let html = '<table><thead><tr><th>Source</th><th>Count</th><th>Failures</th><th>Success Rate</th><th>Avg Duration</th></tr></thead><tbody>';
      for (const s of sources) {
        const badge = 'badge-' + (s.source || 'unknown');
        html += '<tr>'
          + '<td><span class="badge ' + badge + '">' + escapeHtml(s.source) + '</span></td>'
          + '<td>' + s.count + '</td>'
          + '<td style="color:' + (s.failureCount > 0 ? '#f85149' : '#484f58') + '">' + s.failureCount + '</td>'
          + '<td style="color:' + (s.successRate >= 90 ? '#3fb950' : s.successRate >= 70 ? '#d29922' : '#f85149') + '">' + s.successRate + '%</td>'
          + '<td>' + s.avgDurationMs + 'ms</td>'
          + '</tr>';
      }
      html += '</tbody></table>';
      document.getElementById('source-analytics').innerHTML = html;
    }

    function renderMethodAnalytics(methods) {
      if (!methods || methods.length === 0) {
        document.getElementById('method-analytics').innerHTML = '<div style="color:#8b949e;padding:20px;text-align:center">No data</div>';
        return;
      }
      let html = '<table><thead><tr><th>Method</th><th>Source</th><th>Count</th><th>Failures</th><th>Success Rate</th><th>Avg Duration</th></tr></thead><tbody>';
      // Show top 50
      const list = methods.slice(0, 50);
      for (const m of list) {
        const rateColor = m.successRate >= 90 ? '#3fb950' : m.successRate >= 70 ? '#d29922' : '#f85149';
        html += '<tr>'
          + '<td style="font-family:monospace;font-size:0.78rem">' + escapeHtml(m.method) + '</td>'
          + '<td>' + escapeHtml(m.source) + '</td>'
          + '<td>' + m.count + '</td>'
          + '<td style="color:' + (m.failureCount > 0 ? '#f85149' : '#484f58') + '">' + m.failureCount + '</td>'
          + '<td style="color:' + rateColor + '">' + m.successRate + '%</td>'
          + '<td>' + m.avgDurationMs + 'ms</td>'
          + '</tr>';
      }
      html += '</tbody></table>';
      document.getElementById('method-analytics').innerHTML = html;
    }

    function renderErrorRanking(errors) {
      if (!errors || errors.length === 0) {
        document.getElementById('error-ranking').innerHTML = '<div style="color:#8b949e;padding:20px;text-align:center"><i class="fas fa-check-circle" style="color:#3fb950;font-size:1.5rem;display:block;margin-bottom:8px"></i>No errors recorded</div>';
        return;
      }
      let html = '<table><thead><tr><th>Error Type</th><th>Count</th><th>Last Occurred</th></tr></thead><tbody>';
      for (const e of errors) {
        const lastTime = e.lastOccurredAtMs ? new Date(e.lastOccurredAtMs).toLocaleString('zh-CN', { hour12: false }) : '-';
        html += '<tr>'
          + '<td style="color:#f85149;font-family:monospace;font-size:0.78rem">' + escapeHtml(e.errorType) + '</td>'
          + '<td>' + e.count + '</td>'
          + '<td style="font-size:0.75rem;color:#8b949e">' + lastTime + '</td>'
          + '</tr>';
      }
      html += '</tbody></table>';
      document.getElementById('error-ranking').innerHTML = html;
    }

    function renderSlowExecutions(slow) {
      if (!slow || slow.length === 0) {
        document.getElementById('slow-executions').innerHTML = '<div style="color:#8b949e;padding:20px;text-align:center">No slow executions</div>';
        return;
      }
      let html = '<table><thead><tr><th>Method</th><th>Source</th><th>Status</th><th>Duration</th><th>Time</th></tr></thead><tbody>';
      for (const s of slow) {
        const time = s.createdAtMs ? new Date(s.createdAtMs).toLocaleString('zh-CN', { hour12: false }) : '-';
        html += '<tr>'
          + '<td style="font-family:monospace;font-size:0.78rem">' + escapeHtml(s.method) + '</td>'
          + '<td>' + escapeHtml(s.source) + '</td>'
          + '<td>' + escapeHtml(s.status) + '</td>'
          + '<td style="color:#d29922;font-weight:500">' + s.durationMs + 'ms</td>'
          + '<td style="font-size:0.75rem;color:#8b949e">' + time + '</td>'
          + '</tr>';
      }
      html += '</tbody></table>';
      document.getElementById('slow-executions').innerHTML = html;
    }

    loadAll();
  </script>
</body>
</html>
