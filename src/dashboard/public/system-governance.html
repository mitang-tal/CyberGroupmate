<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Governance — CyberGroupmate Dashboard</title>
  <link rel="icon" type="image/png" href="/kissheart.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: #0f1117;
      color: #e1e4e8;
      padding: 24px;
    }
    .app { max-width: 1400px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
    h1 i { color: #58a6ff; }
    .subtitle { color: #8b949e; font-size: 0.85rem; margin-bottom: 24px; }
    a.back { color: #58a6ff; text-decoration: none; }

    .kill-switch-panel {
      background: linear-gradient(135deg, #3d1f2f, #2d1520);
      border: 2px solid #f85149;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .kill-switch-panel .ks-label { font-size: 1.1rem; font-weight: 600; }
    .kill-switch-panel .ks-label i { color: #f85149; margin-right: 8px; }
    .kill-switch-panel .ks-status { font-size: 0.85rem; }
    .kill-switch-panel .ks-status.active { color: #f85149; font-weight: 700; }
    .kill-switch-panel .ks-status.inactive { color: #3fb950; }
    .ks-btn {
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }
    .ks-btn.engage   { background: #f85149; color: #fff; }
    .ks-btn.disengage { background: #3fb950; color: #fff; }
    .ks-btn:hover { opacity: 0.85; }

    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
    .card .label { font-size: 0.75rem; color: #8b949e; text-transform: uppercase; }
    .card .value { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }
    .card .value.red { color: #f85149; }
    .card .value.orange { color: #d29922; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .section { background: #161b22; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
    .section-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #1c2128; border-bottom: 1px solid #30363d; }
    .section-header h2 { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }

    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th { text-align: left; padding: 8px 10px; background: #1c2128; border-bottom: 1px solid #30363d; color: #8b949e; font-weight: 600; white-space: nowrap; }
    td { padding: 8px 10px; border-bottom: 1px solid #21262d; vertical-align: middle; }
    tr:hover td { background: #1c2128; }

    .policy-status {
      display: inline-flex; align-items: center; gap: 4px;
    }
    .ps-active   { color: #3fb950; }
    .ps-disabled { color: #8b949e; }

    .violation-action {
      display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 500;
    }
    .va-blocked           { background: #3d1f2f; color: #ff7b72; }
    .va-escalated_to_human { background: #3d2a1f; color: #d29922; }
    .va-terminated        { background: #3d1f2f; color: #f85149; }

    .rule-tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; background: #21262d; color: #8b949e; }

    .btn {
      background: #21262d; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; padding: 6px 16px; font-size: 0.82rem; cursor: pointer;
    }
    .btn:hover { background: #30363d; }

    .loading { text-align: center; padding: 40px; color: #8b949e; }
    .empty { text-align: center; padding: 40px; color: #8b949e; }
    .empty i { font-size: 2rem; display: block; margin-bottom: 8px; }

    .modal-overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); z-index:100; align-items:center; justify-content:center; }
    .modal-overlay.visible { display: flex; }
    .modal { background: #161b22; border:1px solid #30363d; border-radius:12px; padding:24px; max-width:600px; width:90%; max-height:80vh; overflow-y:auto; }
    .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .modal-header h3 { font-size:1.1rem; }
    .modal-close { background:none; border:none; color:#8b949e; font-size:1.2rem; cursor:pointer; }

    @media (max-width:768px) { .grid-2 { grid-template-columns:1fr; } .kill-switch-panel { flex-direction:column; gap:12px; text-align:center; } }
  </style>
</head>
<body>
  <div class="app">
    <a class="back" href="/">&larr; Dashboard</a>
    <h1><i class="fas fa-shield-alt"></i> System Governance</h1>
    <p class="subtitle">Global safety guardrails, kill switch, and violation audit log</p>

    <!-- Kill Switch -->
    <div class="kill-switch-panel" id="kill-switch-panel">
      <div>
        <div class="ks-label"><i class="fas fa-exclamation-triangle"></i> Emergency Kill Switch</div>
        <div class="ks-status" id="ks-status">Loading...</div>
      </div>
      <button class="ks-btn" id="ks-btn" onclick="toggleKillSwitch()">...</button>
    </div>

    <div class="cards">
      <div class="card"><div class="label">Violations (24h)</div><div class="value red" id="stat-violations">...</div></div>
      <div class="card"><div class="label">Blocked</div><div class="value orange" id="stat-blocked">...</div></div>
      <div class="card"><div class="label">Terminated</div><div class="value red" id="stat-terminated">...</div></div>
    </div>

    <div class="grid-2">
      <!-- Policies -->
      <div class="section">
        <div class="section-header"><h2><i class="fas fa-gavel"></i> Policies</h2></div>
        <div id="policies-content"><div class="loading"><i class="fas fa-spinner fa-spin"></i></div></div>
      </div>

      <!-- Violation Log -->
      <div class="section">
        <div class="section-header"><h2><i class="fas fa-clipboard-list"></i> Violation Log</h2></div>
        <div id="violations-content"><div class="loading"><i class="fas fa-spinner fa-spin"></i></div></div>
      </div>
    </div>
  </div>

  <script>
    function apiUrl(p) { const t=new URL(location.href).searchParams.get('token')||''; return p+(p.includes('?')?'&':'?')+'token='+encodeURIComponent(t); }
    function escapeHtml(s) { if(!s)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    async function loadAll() {
      await loadKillSwitch();
      await loadPolicies();
      await loadViolations();
    }

    async function loadKillSwitch() {
      try {
        const resp = await fetch(apiUrl('/api/governance/kill-switch'));
        if (!resp.ok) throw new Error('not available');
        const data = await resp.json();
        const active = data.active;
        const panel = document.getElementById('kill-switch-panel');
        const statusEl = document.getElementById('ks-status');
        const btn = document.getElementById('ks-btn');
        if (active) {
          panel.style.borderColor = '#f85149';
          statusEl.className = 'ks-status active';
          statusEl.innerHTML = '<i class="fas fa-skull"></i> KILL SWITCH IS ACTIVE — all autonomous operations suspended';
          btn.className = 'ks-btn disengage';
          btn.textContent = 'Disengage Kill Switch';
        } else {
          panel.style.borderColor = '#3fb950';
          statusEl.className = 'ks-status inactive';
          statusEl.innerHTML = '<i class="fas fa-check-circle"></i> Kill switch is disengaged — autonomous operations permitted';
          btn.className = 'ks-btn engage';
          btn.textContent = 'Engage Kill Switch';
        }
      } catch {}
    }

    async function toggleKillSwitch() {
      try {
        const resp = await fetch(apiUrl('/api/governance/kill-switch'), {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ active: !document.getElementById('ks-btn').textContent.includes('Engage') }),
        });
        if (resp.ok) loadKillSwitch();
      } catch {}
    }

    async function loadPolicies() {
      const el = document.getElementById('policies-content');
      try {
        const resp = await fetch(apiUrl('/api/governance/policies'));
        if (!resp.ok) throw new Error('not available');
        const policies = await resp.json();
        if (policies.length === 0) {
          el.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i>No policies</div>';
          return;
        }
        el.innerHTML = '<table><thead><tr><th>Name</th><th>Rule</th><th>Status</th><th>Config</th></tr></thead><tbody>'
          + policies.map(p => {
            const configStr = Object.entries(p.config || {}).map(([k,v]) => k+'='+v).join(', ');
            return '<tr>'
              + '<td>' + escapeHtml(p.name) + '</td>'
              + '<td><span class="rule-tag">' + escapeHtml(p.ruleType) + '</span></td>'
              + '<td><span class="policy-status ps-' + p.status + '"><i class="fas fa-circle"></i> ' + escapeHtml(p.status) + '</span></td>'
              + '<td style="font-size:0.75rem;color:#8b949e;font-family:monospace">' + escapeHtml(configStr) + '</td>'
              + '</tr>';
          }).join('') + '</tbody></table>';
      } catch (err) {
        el.innerHTML = '<div class="empty"><i class="fas fa-exclamation-triangle"></i>' + escapeHtml(err.message) + '</div>';
      }
    }

    async function loadViolations() {
      const el = document.getElementById('violations-content');
      try {
        const resp = await fetch(apiUrl('/api/governance/violations?limit=50'));
        if (!resp.ok) throw new Error('not available');
        const violations = await resp.json();
        if (violations.length === 0) {
          el.innerHTML = '<div class="empty"><i class="fas fa-check-circle" style="color:#3fb950"></i>No violations</div>';
          // Update stats
          document.getElementById('stat-violations').textContent = '0';
          document.getElementById('stat-blocked').textContent = '0';
          document.getElementById('stat-terminated').textContent = '0';
          return;
        }
        el.innerHTML = '<table><thead><tr><th>Action</th><th>Rule</th><th>Source</th><th>Reasoning</th><th>Time</th></tr></thead><tbody>'
          + violations.map(v => {
            const vaClass = 'va-' + v.actionTaken;
            const time = v.createdAtMs ? new Date(v.createdAtMs).toLocaleString('zh-CN',{hour12:false}) : '-';
            const reasonShort = v.reasoning.length > 50 ? escapeHtml(v.reasoning.slice(0,50))+'…' : escapeHtml(v.reasoning);
            return '<tr>'
              + '<td><span class="violation-action ' + vaClass + '">' + escapeHtml(v.actionTaken) + '</span></td>'
              + '<td><span class="rule-tag">' + escapeHtml(v.ruleType) + '</span></td>'
              + '<td style="font-family:monospace;font-size:0.75rem">' + escapeHtml(v.sourceType) + '</td>'
              + '<td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + escapeHtml(v.reasoning) + '">' + reasonShort + '</td>'
              + '<td style="font-size:0.75rem;color:#8b949e">' + time + '</td>'
              + '</tr>';
          }).join('') + '</tbody></table>';

        document.getElementById('stat-violations').textContent = violations.length;
        document.getElementById('stat-blocked').textContent = violations.filter(v => v.actionTaken === 'blocked').length;
        document.getElementById('stat-terminated').textContent = violations.filter(v => v.actionTaken === 'terminated').length;
      } catch (err) {
        el.innerHTML = '<div class="empty"><i class="fas fa-exclamation-triangle"></i>' + escapeHtml(err.message) + '</div>';
      }
    }

    loadAll();
  </script>
</body>
</html>
