<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Self-Healing — CyberGroupmate Dashboard</title>
  <link rel="icon" type="image/png" href="/kissheart.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: #0f1117;
      color: #e1e4e8;
      padding: 24px;
      min-height: 100vh;
    }
    .app { max-width: 1400px; margin: 0 auto; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
    h1 i { color: #58a6ff; }
    .subtitle { color: #8b949e; font-size: 0.85rem; margin-bottom: 24px; }
    a.back { color: #58a6ff; text-decoration: none; font-size: 0.85rem; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
    }
    .card .label { font-size: 0.75rem; color: #8b949e; text-transform: uppercase; }
    .card .value { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }
    .card .value.green  { color: #3fb950; }
    .card .value.red    { color: #f85149; }
    .card .value.blue   { color: #58a6ff; }
    .card .value.orange { color: #d29922; }

    .section {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #1c2128;
      border-bottom: 1px solid #30363d;
    }
    .section-header h2 { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    th {
      text-align: left;
      padding: 8px 10px;
      background: #1c2128;
      border-bottom: 1px solid #30363d;
      color: #8b949e;
      font-weight: 600;
      white-space: nowrap;
    }
    td {
      padding: 8px 10px;
      border-bottom: 1px solid #21262d;
      vertical-align: middle;
    }
    tr:hover td { background: #1c2128; }
    tr.clickable { cursor: pointer; }

    .strategy-tag {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 500;
    }
    .strategy-retry  { background: #1f3a5f; color: #79c0ff; }
    .strategy-fallback { background: #3d2a1f; color: #d29922; }
    .strategy-meta_diagnosis { background: #1f3d2f; color: #7ee787; }
    .strategy-escalate { background: #3d1f2f; color: #ff7b72; }

    .action-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }
    .action-status i { font-size: 0.65rem; }
    .as-pending     { color: #8b949e; }
    .as-in_progress { color: #58a6ff; }
    .as-succeeded   { color: #3fb950; }
    .as-failed      { color: #f85149; }

    .loading { text-align: center; padding: 40px; color: #8b949e; }
    .loading i { font-size: 1.5rem; }
    .empty { text-align: center; padding: 40px; color: #8b949e; }
    .empty i { font-size: 2rem; display: block; margin-bottom: 8px; }
    .error-banner {
      background: #3d1f2f;
      border: 1px solid #f85149;
      border-radius: 8px;
      padding: 12px 16px;
      color: #f85149;
      margin-bottom: 16px;
    }

    .btn {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      padding: 6px 16px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .btn:hover { background: #30363d; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.visible { display: flex; }
    .modal {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      max-width: 700px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .modal-header h3 { font-size: 1.1rem; }
    .modal-close { background: none; border: none; color: #8b949e; font-size: 1.2rem; cursor: pointer; }
    .modal-close:hover { color: #f85149; }
    .modal-section { margin-bottom: 16px; }
    .modal-section h4 { font-size: 0.85rem; color: #58a6ff; margin-bottom: 8px; font-weight: 600; }
    .modal-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.82rem; }
    .modal-info-grid .label { color: #8b949e; }
    .modal-info-grid .value { color: #e1e4e8; font-family: monospace; font-size: 0.8rem; }
    .preview { font-family: monospace; font-size: 0.75rem; color: #8b949e; background: #0f1117; padding: 8px; border-radius: 6px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }

    @media (max-width: 768px) {
      body { padding: 12px; }
      .cards { grid-template-columns: repeat(2, 1fr); }
      .modal-info-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <a class="back" href="/">&larr; Dashboard</a>
    <h1><i class="fas fa-heartbeat"></i> Self-Healing</h1>
    <p class="subtitle">Automated recovery actions, retry attempts, and Meta diagnosis results</p>

    <div class="cards" id="stats-cards">
      <div class="card"><div class="label">Total Actions</div><div class="value blue" id="stat-total">...</div></div>
      <div class="card"><div class="label">Succeeded</div><div class="value green" id="stat-succeeded">...</div></div>
      <div class="card"><div class="label">Failed</div><div class="value red" id="stat-failed">...</div></div>
      <div class="card"><div class="label">Success Rate</div><div class="value green" id="stat-sr">...</div></div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2><i class="fas fa-notes-medical"></i> Healing Actions</h2>
        <button class="btn" onclick="loadActions()"><i class="fas fa-sync"></i> Refresh</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Strategy</th>
            <th>Status</th>
            <th>Alert ID</th>
            <th>Decision</th>
            <th>Attempts</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="actions-body">
          <tr><td colspan="6" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Action Detail</h3>
        <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    function getToken() {
      const u = new URL(window.location.href);
      return u.searchParams.get('token') || '';
    }
    function apiUrl(path) {
      const t = getToken();
      return path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(t);
    }
    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function loadActions() {
      const tb = document.getElementById('actions-body');
      tb.innerHTML = '<tr><td colspan="6" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>';

      try {
        const resp = await fetch(apiUrl('/api/execution-heal/actions?limit=100'));
        if (!resp.ok) throw new Error(resp.statusText);
        const actions = await resp.json();
        renderActions(actions);
        renderStats(actions);
      } catch (err) {
        tb.innerHTML = '<tr><td colspan="6" class="empty"><i class="fas fa-exclamation-triangle"></i>Failed: ' + escapeHtml(err.message) + '</td></tr>';
      }
    }

    function renderActions(actions) {
      const tb = document.getElementById('actions-body');
      if (actions.length === 0) {
        tb.innerHTML = '<tr><td colspan="6" class="empty"><i class="fas fa-check-circle" style="color:#3fb950"></i>No healing actions recorded</td></tr>';
        return;
      }

      tb.innerHTML = actions.map(a => {
        const stratClass = 'strategy-' + a.strategy;
        const stratIcon = a.strategy === 'retry' ? 'fa-redo' : a.strategy === 'fallback' ? 'fa-random' : a.strategy === 'meta_diagnosis' ? 'fa-brain' : 'fa-exclamation-triangle';
        const statusIcon = a.status === 'succeeded' ? 'fa-check-circle' : a.status === 'failed' ? 'fa-times-circle' : a.status === 'in_progress' ? 'fa-spinner fa-pulse' : 'fa-clock';
        const statusClass = 'as-' + a.status;
        const time = a.createdAtMs ? new Date(a.createdAtMs).toLocaleString('zh-CN', { hour12: false }) : '-';
        const reasonShort = a.decisionReason.length > 60
          ? escapeHtml(a.decisionReason.slice(0, 60)) + '…'
          : escapeHtml(a.decisionReason);

        return '<tr class="clickable" onclick="openDetail(\'' + a.actionId + '\')">'
          + '<td><span class="strategy-tag ' + stratClass + '"><i class="fas ' + stratIcon + '"></i> ' + escapeHtml(a.strategy) + '</span></td>'
          + '<td><span class="action-status ' + statusClass + '"><i class="fas ' + statusIcon + '"></i> ' + escapeHtml(a.status) + '</span></td>'
          + '<td style="font-family:monospace;font-size:0.75rem;color:#8b949e">' + escapeHtml(a.alertId.slice(0, 8)) + '…</td>'
          + '<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + escapeHtml(a.decisionReason) + '">' + reasonShort + '</td>'
          + '<td>' + a.attemptCount + '</td>'
          + '<td style="font-size:0.75rem;color:#8b949e;white-space:nowrap">' + time + '</td>'
          + '</tr>';
      }).join('');
    }

    function renderStats(actions) {
      const total = actions.length;
      const succeeded = actions.filter(a => a.status === 'succeeded').length;
      const failed = actions.filter(a => a.status === 'failed').length;
      const terminal = succeeded + failed;
      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-succeeded').textContent = succeeded;
      document.getElementById('stat-failed').textContent = failed;
      document.getElementById('stat-sr').textContent = terminal > 0 ? Math.round(succeeded / terminal * 100) + '%' : '-';
    }

    // ─── Detail Modal ───
    async function openDetail(actionId) {
      const overlay = document.getElementById('modal-overlay');
      overlay.classList.add('visible');
      document.getElementById('modal-title').textContent = 'Healing Action: ' + actionId.slice(0, 8) + '…';

      let html = '<div class="modal-section"><div class="modal-info-grid">';

      try {
        const resp = await fetch(apiUrl('/api/execution-heal/actions/' + encodeURIComponent(actionId)));
        if (!resp.ok) throw new Error('Not found');
        const a = await resp.json();

        html += '<div><span class="label">Strategy</span><br><span class="value">' + escapeHtml(a.strategy) + '</span></div>';
        html += '<div><span class="label">Status</span><br><span class="value">' + escapeHtml(a.status) + '</span></div>';
        html += '<div><span class="label">Alert ID</span><br><span class="value">' + escapeHtml(a.alertId) + '</span></div>';
        html += '<div><span class="label">Execution ID</span><br><span class="value">' + escapeHtml(a.executionId) + '</span></div>';
        html += '<div><span class="label">Attempts</span><br><span class="value">' + a.attemptCount + '</span></div>';
        html += '<div><span class="label">Created</span><br><span class="value">' + (a.createdAtMs ? new Date(a.createdAtMs).toLocaleString() : '-') + '</span></div>';
        if (a.completedAtMs) {
          html += '<div><span class="label">Completed</span><br><span class="value">' + new Date(a.completedAtMs).toLocaleString() + '</span></div>';
        }
        html += '</div></div>';

        html += '<div class="modal-section"><h4>Decision Reason</h4>';
        html += '<p style="font-size:0.85rem;color:#e1e4e8">' + escapeHtml(a.decisionReason) + '</p></div>';

        if (a.error) {
          html += '<div class="modal-section"><h4>Error</h4>';
          html += '<p style="color:#f85149;font-size:0.85rem">' + escapeHtml(a.error) + '</p></div>';
        }

        if (a.actionDetails) {
          html += '<div class="modal-section"><h4>Details</h4>';
          html += '<div class="preview">' + escapeHtml(JSON.stringify(a.actionDetails, null, 2)) + '</div></div>';
        }

      } catch (err) {
        html += '<div style="color:#f85149">Error: ' + escapeHtml(err.message) + '</div>';
      }

      document.getElementById('modal-body').innerHTML = html;
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('visible');
    }

    document.getElementById('modal-overlay').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    loadActions();
  </script>
</body>
</html>
