<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Reputation — CyberGroupmate Dashboard</title>
  <link rel="icon" type="image/png" href="/kissheart.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif; background:#0f1117; color:#e1e4e8; padding:24px; }
    .app { max-width:1400px; margin:0 auto; }
    h1 { font-size:1.5rem; margin-bottom:8px; display:flex; align-items:center; gap:10px; }
    h1 i { color:#58a6ff; }
    .subtitle { color:#8b949e; font-size:0.85rem; margin-bottom:24px; }
    a.back { color:#58a6ff; text-decoration:none; }

    .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin-bottom:20px; }
    .card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:16px; }
    .card .label { font-size:0.75rem; color:#8b949e; text-transform:uppercase; }
    .card .value { font-size:1.5rem; font-weight:700; margin-top:4px; }
    .card .value.green { color:#3fb950; }
    .card .value.orange { color:#d29922; }
    .card .value.red { color:#f85149; }
    .card .value.purple { color:#bc8cff; }

    .section { background:#161b22; border:1px solid #30363d; border-radius:8px; margin-bottom:16px; overflow:hidden; }
    .section-header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:#1c2128; border-bottom:1px solid #30363d; }
    .section-header h2 { font-size:1rem; font-weight:600; display:flex; align-items:center; gap:8px; }

    table { width:100%; border-collapse:collapse; font-size:0.82rem; }
    th { text-align:left; padding:8px 10px; background:#1c2128; border-bottom:1px solid #30363d; color:#8b949e; font-weight:600; white-space:nowrap; }
    td { padding:8px 10px; border-bottom:1px solid #21262d; vertical-align:middle; }
    tr:hover td { background:#1c2128; }

    .trust-tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:0.7rem; font-weight:600; }
    .trust-trusted   { background:#1f3d2f; color:#7ee787; }
    .trust-normal    { background:#1f3a5f; color:#79c0ff; }
    .trust-probation { background:#3d2a1f; color:#d29922; }
    .trust-untrusted { background:#3d1f2f; color:#ff7b72; }

    .btn { background:#21262d; border:1px solid #30363d; border-radius:6px; color:#c9d1d9; padding:6px 16px; font-size:0.82rem; cursor:pointer; }
    .btn:hover { background:#30363d; }
    .btn-sm { padding:4px 10px; font-size:0.75rem; }

    .loading { text-align:center; padding:40px; color:#8b949e; }
    .empty { text-align:center; padding:40px; color:#8b949e; }

    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:12px; }

    .cap-card { background:#0f1117; border:1px solid #30363d; border-radius:6px; padding:12px; }
    .cap-card .cap-name { font-size:0.82rem; font-weight:600; margin-bottom:4px; }
    .cap-card .cap-stat { font-size:0.75rem; color:#8b949e; }

    .bar { height:6px; background:#1c2128; border-radius:3px; margin:4px 0; }
    .bar-fill { height:100%; border-radius:3px; }

    .gen-panel { padding:16px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .gen-panel input { background:#0f1117; border:1px solid #30363d; border-radius:6px; color:#e1e4e8; padding:8px 12px; font-size:0.85rem; outline:none; }
    .gen-panel input:focus { border-color:#58a6ff; }

    @media (max-width:768px) { .grid-2,.grid-3 { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <a class="back" href="/">&larr; Dashboard</a>
    <h1><i class="fas fa-star"></i> Agent Reputation Center</h1>
    <p class="subtitle">Multi-dimensional reputation, trust states, and capability mastery matrix</p>

    <div class="cards" id="stat-cards">
      <div class="card"><div class="label">Trusted</div><div class="value green" id="s-trusted">—</div></div>
      <div class="card"><div class="label">Normal</div><div class="value blue" id="s-normal">—</div></div>
      <div class="card"><div class="label">Probation</div><div class="value orange" id="s-probation">—</div></div>
      <div class="card"><div class="label">Untrusted</div><div class="value red" id="s-untrusted">—</div></div>
    </div>

    <!-- Simulate evaluation -->
    <div class="section">
      <div class="section-header"><h2><i class="fas fa-flask"></i> Simulate Evaluation</h2></div>
      <div class="gen-panel">
        <input id="ev-agent-id" placeholder="agentId" size="15" />
        <input id="ev-agent-name" placeholder="name" size="15" />
        <input id="ev-success" placeholder="successes" size="8" value="10" />
        <input id="ev-fail" placeholder="failures" size="8" value="1" />
        <input id="ev-alerts" placeholder="alerts" size="8" value="0" />
        <button class="btn" onclick="simulateEval()"><i class="fas fa-calculator"></i> Evaluate</button>
      </div>
      <div id="eval-result" style="padding:0 16px 12px;font-size:0.85rem"></div>
    </div>

    <!-- Agent List -->
    <div class="section">
      <div class="section-header">
        <h2><i class="fas fa-robot"></i> Agent Reputations</h2>
        <button class="btn btn-sm" onclick="loadAgents()"><i class="fas fa-sync"></i></button>
      </div>
      <table>
        <thead><tr><th>Agent</th><th>Trust</th><th>Score</th><th>Reliability</th><th>Risk</th><th>Executions</th><th>Capabilities</th></tr></thead>
        <tbody id="agents-body"><tr><td colspan="7" class="loading"><i class="fas fa-spinner fa-spin"></i></td></tr></tbody>
      </table>
    </div>
  </div>

  <script>
    function apiUrl(p) { const t=new URL(location.href).searchParams.get('token')||''; return p+(p.includes('?')?'&':'?')+'token='+encodeURIComponent(t); }
    function escapeHtml(s) { if(!s)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    async function loadAgents() {
      const tb = document.getElementById('agents-body');
      try {
        const resp = await fetch(apiUrl('/api/reputation/agents'));
        if (!resp.ok) throw new Error('unavailable');
        const agents = await resp.json();
        // Stats
        const trusted = agents.filter(a => a.trustState === 'trusted').length;
        const normal = agents.filter(a => a.trustState === 'normal').length;
        const probation = agents.filter(a => a.trustState === 'probation').length;
        const untrusted = agents.filter(a => a.trustState === 'untrusted').length;
        document.getElementById('s-trusted').textContent = trusted;
        document.getElementById('s-normal').textContent = normal;
        document.getElementById('s-probation').textContent = probation;
        document.getElementById('s-untrusted').textContent = untrusted;

        if (agents.length === 0) {
          tb.innerHTML = '<tr><td colspan="7" class="empty"><i class="fas fa-inbox"></i>No reputation data</td></tr>';
          return;
        }
        tb.innerHTML = agents.map(a => {
          const trustClass = 'trust-' + a.trustState;
          const scorePct = Math.round((a.trustScore || 0) * 100);
          const reliabilityPct = Math.round((a.reliability || 0) * 100);
          const riskPct = Math.round((a.riskProbability || 0) * 100);
          const capCount = a.capabilityScores?.length || 0;
          return '<tr>'
            + '<td><strong>' + escapeHtml(a.agentName) + '</strong></td>'
            + '<td><span class="trust-tag ' + trustClass + '">' + escapeHtml(a.trustState) + '</span></td>'
            + '<td>' + scorePct + '%</td>'
            + '<td>' + reliabilityPct + '%</td>'
            + '<td>' + riskPct + '%</td>'
            + '<td>' + (a.totalExecutions || 0) + '</td>'
            + '<td>' + capCount + '</td>'
            + '</tr>';
        }).join('');
      } catch (err) {
        tb.innerHTML = '<tr><td colspan="7" class="empty"><i class="fas fa-exclamation-triangle"></i>' + escapeHtml(err.message) + '</td></tr>';
      }
    }

    async function simulateEval() {
      const agentId = document.getElementById('ev-agent-id').value.trim();
      const agentName = document.getElementById('ev-agent-name').value.trim();
      const successes = parseInt(document.getElementById('ev-success').value) || 10;
      const failures = parseInt(document.getElementById('ev-fail').value) || 1;
      const alerts = parseInt(document.getElementById('ev-alerts').value) || 0;

      if (!agentId || !agentName) {
        document.getElementById('eval-result').innerHTML = '<span style="color:#d29922">agentId and name required</span>';
        return;
      }

      const executions = [];
      for (let i = 0; i < successes; i++) {
        executions.push({ capabilityId: 'cap_1', capabilityName: 'general', success: true, latencyMs: 1000, timestampMs: Date.now() });
      }
      for (let i = 0; i < failures; i++) {
        executions.push({ capabilityId: 'cap_1', capabilityName: 'general', success: false, latencyMs: 2000, errorType: 'Error', timestampMs: Date.now() });
      }

      try {
        const resp = await fetch(apiUrl('/api/reputation/evaluate'), {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ agentId, agentName, executions, alerts, failures }),
        });
        const data = await resp.json();
        if (resp.ok) {
          const score = Math.round((data.trustScore || 0) * 100);
          document.getElementById('eval-result').innerHTML =
            '<span style="color:#3fb950"><i class="fas fa-check-circle"></i> ' + escapeHtml(data.agentName) + ': trustScore=' + score + '%, state=' + escapeHtml(data.trustState) + ', reliability=' + Math.round((data.reliability || 0) * 100) + '%</span>';
          await loadAgents();
        } else {
          document.getElementById('eval-result').innerHTML = '<span style="color:#f85149">' + escapeHtml(data.error || 'Failed') + '</span>';
        }
      } catch (err) {
        document.getElementById('eval-result').innerHTML = '<span style="color:#f85149">' + escapeHtml(err.message) + '</span>';
      }
    }

    loadAgents();
  </script>
</body>
</html>
