<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Failure Intelligence — CyberGroupmate Dashboard</title>
  <link rel="icon" type="image/png" href="/kissheart.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif; background:#0f1117; color:#e1e4e8; padding:24px; }
    .app { max-width:1400px; margin:0 auto; }
    h1 { font-size:1.5rem; margin-bottom:8px; display:flex; align-items:center; gap:10px; }
    h1 i { color:#58a6ff; }
    .subtitle { color:#8b949e; font-size:0.85rem; margin-bottom:24px; }
    a.back { color:#58a6ff; text-decoration:none; }

    .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; margin-bottom:20px; }
    .card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:16px; }
    .card .label { font-size:0.75rem; color:#8b949e; text-transform:uppercase; }
    .card .value { font-size:1.5rem; font-weight:700; margin-top:4px; }
    .card .value.green { color:#3fb950; }
    .card .value.blue { color:#58a6ff; }
    .card .value.orange { color:#d29922; }
    .card .value.purple { color:#bc8cff; }

    .section { background:#161b22; border:1px solid #30363d; border-radius:8px; margin-bottom:16px; overflow:hidden; }
    .section-header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:#1c2128; border-bottom:1px solid #30363d; }
    .section-header h2 { font-size:1rem; font-weight:600; display:flex; align-items:center; gap:8px; }

    table { width:100%; border-collapse:collapse; font-size:0.82rem; }
    th { text-align:left; padding:8px 10px; background:#1c2128; border-bottom:1px solid #30363d; color:#8b949e; font-weight:600; white-space:nowrap; }
    td { padding:8px 10px; border-bottom:1px solid #21262d; vertical-align:middle; }
    tr:hover td { background:#1c2128; }

    .cat-tag { display:inline-block; padding:2px 6px; border-radius:4px; font-size:0.7rem; font-weight:500; }
    .cat-tool_capability_mismatch { background:#1f3a5f; color:#79c0ff; }
    .cat-parameter_invalid { background:#3d2a1f; color:#d29922; }
    .cat-resource_exhausted { background:#3d1f2f; color:#ff7b72; }
    .cat-logic_deadlock { background:#1f3d2f; color:#7ee787; }

    .conf-bar { height:6px; border-radius:3px; background:#1c2128; width:80px; display:inline-block; vertical-align:middle; margin-right:6px; }
    .conf-fill { height:100%; border-radius:3px; }

    .exp-status { display:inline-flex; align-items:center; gap:4px; font-weight:500; }
    .es-active  { color:#3fb950; }
    .es-decayed { color:#d29922; }
    .es-expired { color:#8b949e; }
    .es-revoked { color:#f85149; }

    .btn {
      background:#21262d; border:1px solid #30363d; border-radius:6px; color:#c9d1d9; padding:6px 16px; font-size:0.82rem; cursor:pointer;
    }
    .btn:hover { background:#30363d; }
    .btn-sm { padding:4px 10px; font-size:0.75rem; }

    .gen-panel { padding:16px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .gen-panel input, .gen-panel select { background:#0f1117; border:1px solid #30363d; border-radius:6px; color:#e1e4e8; padding:8px 12px; font-size:0.85rem; outline:none; }
    .gen-panel input:focus { border-color:#58a6ff; }

    .loading { text-align:center; padding:40px; color:#8b949e; }
    .empty { text-align:center; padding:40px; color:#8b949e; }
    .empty i { font-size:2rem; display:block; margin-bottom:8px; }

    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }

    .modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); z-index:100; align-items:center; justify-content:center; }
    .modal-overlay.visible { display:flex; }
    .modal { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:24px; max-width:600px; width:90%; max-height:80vh; overflow-y:auto; }
    .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .modal-header h3 { font-size:1.1rem; }
    .modal-close { background:none; border:none; color:#8b949e; font-size:1.2rem; cursor:pointer; }
    .preview { font-family:monospace; font-size:0.75rem; color:#8b949e; background:#0f1117; padding:8px; border-radius:6px; max-height:150px; overflow-y:auto; white-space:pre-wrap; }

    @media (max-width:768px) { .grid-2 { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <a class="back" href="/">&larr; Dashboard</a>
    <h1><i class="fas fa-brain"></i> Failure Intelligence</h1>
    <p class="subtitle">Experience memory: failure patterns, learned rules, and preventive constraints</p>

    <div class="cards" id="stats-cards">
      <div class="card"><div class="label">Active Rules</div><div class="value green" id="stat-active">—</div></div>
      <div class="card"><div class="label">Failure Patterns</div><div class="value orange" id="stat-patterns">—</div></div>
      <div class="card"><div class="label">Decayed</div><div class="value gray" id="stat-decayed" style="color:#8b949e">—</div></div>
      <div class="card"><div class="label">Expired</div><div class="value gray" id="stat-expired" style="color:#8b949e">—</div></div>
    </div>

    <!-- Extract Panel -->
    <div class="section">
      <div class="section-header"><h2><i class="fas fa-flask"></i> Extract Failure Pattern</h2></div>
      <div class="gen-panel">
        <input id="ext-trigger" placeholder="triggerContext (e.g. telegram_media_send)" size="25" />
        <input id="ext-symptom" placeholder="symptom (e.g. unknown_method)" size="20" />
        <input id="ext-cause" placeholder="rootCause" size="20" />
        <select id="ext-category">
          <option value="tool_capability_mismatch">tool_capability_mismatch</option>
          <option value="parameter_invalid">parameter_invalid</option>
          <option value="resource_exhausted">resource_exhausted</option>
          <option value="logic_deadlock">logic_deadlock</option>
        </select>
        <input id="ext-tool" placeholder="tool (optional)" size="15" />
        <button class="btn" onclick="extractPattern()"><i class="fas fa-magic"></i> Extract</button>
      </div>
      <div id="extract-result" style="padding:0 16px 12px;font-size:0.85rem"></div>
    </div>

    <div class="grid-2">
      <!-- Failure Patterns -->
      <div class="section">
        <div class="section-header">
          <h2><i class="fas fa-exclamation-triangle"></i> Failure Patterns</h2>
          <button class="btn btn-sm" onclick="loadPatterns()"><i class="fas fa-sync"></i></button>
        </div>
        <div id="patterns-body"><div class="loading"><i class="fas fa-spinner fa-spin"></i></div></div>
      </div>

      <!-- Active Experiences (Rules) -->
      <div class="section">
        <div class="section-header">
          <h2><i class="fas fa-shield"></i> Active Experience Rules</h2>
          <button class="btn btn-sm" onclick="loadExperiences()"><i class="fas fa-sync"></i></button>
        </div>
        <div id="experiences-body"><div class="loading"><i class="fas fa-spinner fa-spin"></i></div></div>
      </div>
    </div>

    <!-- Inject Test -->
    <div class="section">
      <div class="section-header"><h2><i class="fas fa-plug"></i> Test Injection</h2></div>
      <div class="gen-panel">
        <input id="inj-task" placeholder="taskType (e.g. telegram.sendPhoto)" size="30" />
        <input id="inj-cat" placeholder="category (optional)" size="15" />
        <button class="btn" onclick="testInject()"><i class="fas fa-rocket"></i> Test Dispatch Injection</button>
      </div>
      <div id="inject-result" style="padding:0 16px 12px;font-size:0.85rem"></div>
    </div>
  </div>

  <script>
    function apiUrl(p) { const t=new URL(location.href).searchParams.get('token')||''; return p+(p.includes('?')?'&':'?')+'token='+encodeURIComponent(t); }
    function escapeHtml(s) { if(!s)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    async function loadAll() {
      await loadPatterns();
      await loadExperiences();
    }

    async function loadPatterns() {
      const el = document.getElementById('patterns-body');
      try {
        const resp = await fetch(apiUrl('/api/experience/patterns'));
        if (!resp.ok) throw new Error('unavailable');
        const items = await resp.json();
        if (!items || items.length === 0) {
          el.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i>No patterns yet</div>';
          return;
        }
        el.innerHTML = '<table><thead><tr><th>Category</th><th>Trigger</th><th>Symptom</th><th>Freq</th><th>Confidence</th></tr></thead><tbody>'
          + items.map(p => {
            const catClass = 'cat-' + (p.category || 'unknown');
            const pct = Math.round((p.confidence || 0) * 100);
            const color = pct >= 80 ? '#3fb950' : pct >= 50 ? '#d29922' : '#8b949e';
            return '<tr>'
              + '<td><span class="cat-tag ' + catClass + '">' + escapeHtml(p.category) + '</span></td>'
              + '<td style="font-family:monospace;font-size:0.78rem">' + escapeHtml(p.triggerContext || '') + '</td>'
              + '<td style="font-family:monospace;font-size:0.78rem;color:#f85149">' + escapeHtml(p.symptom || '') + '</td>'
              + '<td>' + (p.frequency || 0) + '</td>'
              + '<td><div class="conf-bar"><div class="conf-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' + pct + '%</td>'
              + '</tr>';
          }).join('') + '</tbody></table>';
      } catch (err) {
        el.innerHTML = '<div class="empty"><i class="fas fa-exclamation-triangle"></i>' + escapeHtml(err.message) + '</div>';
      }
    }

    async function loadExperiences() {
      const el = document.getElementById('experiences-body');
      try {
        const resp = await fetch(apiUrl('/api/experience/patterns'));
        if (!resp.ok) throw new Error('unavailable');
        const items = await resp.json();
        const active = (items || []).filter(e => e.status === 'active' || !e.status);
        const decayed = (items || []).filter(e => e.status === 'decayed').length;
        const expired = (items || []).filter(e => e.status === 'expired').length;

        document.getElementById('stat-active').textContent = active.length;
        document.getElementById('stat-patterns').textContent = (items || []).length;
        document.getElementById('stat-decayed').textContent = decayed;
        document.getElementById('stat-expired').textContent = expired;

        if (active.length === 0) {
          el.innerHTML = '<div class="empty"><i class="fas fa-check-circle" style="color:#3fb950"></i>No active rules</div>';
          return;
        }
        el.innerHTML = '<table><thead><tr><th>Rule</th><th>Conf</th><th>Freq</th><th>Status</th><th>Expires</th></tr></thead><tbody>'
          + active.slice(0, 20).map(e => {
            const statusClass = 'es-' + (e.status || 'active');
            const pct = Math.round((e.confidence || 0) * 100);
            const expires = e.expiresAtMs ? new Date(e.expiresAtMs).toLocaleDateString() : '-';
            const ruleStr = e.rule && e.rule.avoid ? 'avoid: ' + escapeHtml(e.rule.avoid) : '—';
            return '<tr>'
              + '<td style="font-family:monospace;font-size:0.78rem">' + ruleStr + '</td>'
              + '<td>' + pct + '%</td>'
              + '<td>' + (e.frequency || 0) + '</td>'
              + '<td><span class="exp-status ' + statusClass + '">' + escapeHtml(e.status || 'active') + '</span></td>'
              + '<td style="font-size:0.75rem;color:#8b949e">' + expires + '</td>'
              + '</tr>';
          }).join('') + '</tbody></table>';
      } catch (err) {
        el.innerHTML = '<div class="empty"><i class="fas fa-exclamation-triangle"></i>' + escapeHtml(err.message) + '</div>';
      }
    }

    async function extractPattern() {
      const triggerContext = document.getElementById('ext-trigger').value.trim();
      const symptom = document.getElementById('ext-symptom').value.trim();
      const rootCause = document.getElementById('ext-cause').value.trim();
      const category = document.getElementById('ext-category').value;
      const tool = document.getElementById('ext-tool').value.trim() || undefined;

      if (!triggerContext || !symptom || !rootCause) {
        document.getElementById('extract-result').innerHTML = '<span style="color:#d29922">triggerContext, symptom, rootCause required</span>';
        return;
      }

      document.getElementById('extract-result').innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Extracting...';
      try {
        const resp = await fetch(apiUrl('/api/experience/extract'), {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ triggerContext, symptom, rootCause, category, tool }),
        });
        const data = await resp.json();
        if (resp.ok) {
          const conf = data.pattern ? Math.round(data.pattern.confidence * 100) : 0;
          const hasExp = data.experience ? 'yes' : 'no (confidence too low)';
          document.getElementById('extract-result').innerHTML =
            '<span style="color:#3fb950"><i class="fas fa-check-circle"></i> Pattern: ' + escapeHtml(data.pattern.patternId.slice(0,8)) + '… | confidence=' + conf + '% | experience=' + hasExp + '</span>';
          await loadAll();
        } else {
          document.getElementById('extract-result').innerHTML = '<span style="color:#f85149">' + escapeHtml(data.error || 'Failed') + '</span>';
        }
      } catch (err) {
        document.getElementById('extract-result').innerHTML = '<span style="color:#f85149">' + escapeHtml(err.message) + '</span>';
      }
    }

    async function testInject() {
      const taskType = document.getElementById('inj-task').value.trim();
      const category = document.getElementById('inj-cat').value.trim() || undefined;
      if (!taskType) { document.getElementById('inject-result').innerHTML = '<span style="color:#d29922">taskType required</span>'; return; }
      try {
        const resp = await fetch(apiUrl('/api/experience/inject-dispatch'), {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ taskType, category }),
        });
        const data = await resp.json();
        if (resp.ok) {
          const avoids = data.constraints?.avoid || [];
          const prefers = data.constraints?.prefer || [];
          document.getElementById('inject-result').innerHTML =
            '<span style="color:#58a6ff"><i class="fas fa-info-circle"></i> ' + (data.experiences || []).length + ' rules applied</span>'
            + (avoids.length > 0 ? '<div style="margin-top:4px;color:#f85149">avoid: ' + avoids.map(escapeHtml).join(', ') + '</div>' : '')
            + (prefers.length > 0 ? '<div style="margin-top:4px;color:#3fb950">prefer: ' + prefers.map(escapeHtml).join(', ') + '</div>' : '');
        } else {
          document.getElementById('inject-result').innerHTML = '<span style="color:#f85149">' + escapeHtml(data.error || 'Failed') + '</span>';
        }
      } catch (err) {
        document.getElementById('inject-result').innerHTML = '<span style="color:#f85149">' + escapeHtml(err.message) + '</span>';
      }
    }

    loadAll();
  </script>
</body>
</html>
