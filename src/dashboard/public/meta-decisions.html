<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meta Decision Center — CyberGroupmate Dashboard</title>
  <link rel="icon" type="image/png" href="/kissheart.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: #0f1117;
      color: #e1e4e8;
      padding: 24px;
      min-height: 100vh;
    }
    .app { max-width: 1400px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
    h1 i { color: #58a6ff; }
    .subtitle { color: #8b949e; font-size: 0.85rem; margin-bottom: 24px; }
    a.back { color: #58a6ff; text-decoration: none; font-size: 0.85rem; }

    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
    .card .label { font-size: 0.75rem; color: #8b949e; text-transform: uppercase; }
    .card .value { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }
    .card .value.green  { color: #3fb950; }
    .card .value.orange { color: #d29922; }
    .card .value.blue   { color: #58a6ff; }
    .card .value.purple { color: #bc8cff; }
    .card .value.red    { color: #f85149; }

    .section { background: #161b22; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
    .section-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #1c2128; border-bottom: 1px solid #30363d; }
    .section-header h2 { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }

    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th { text-align: left; padding: 8px 10px; background: #1c2128; border-bottom: 1px solid #30363d; color: #8b949e; font-weight: 600; white-space: nowrap; }
    td { padding: 8px 10px; border-bottom: 1px solid #21262d; vertical-align: middle; }
    tr:hover td { background: #1c2128; }
    tr.clickable { cursor: pointer; }

    .dtag {
      display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 500;
    }
    .dt-switch_policy { background: #1f3a5f; color: #79c0ff; }
    .dt-redispatch   { background: #3d2a1f; color: #d29922; }
    .dt-degrade      { background: #3d1f2f; color: #ff7b72; }
    .dt-scale_agent  { background: #1f3d2f; color: #7ee787; }

    .dstatus { display: inline-flex; align-items: center; gap: 4px; font-weight: 500; }
    .ds-proposed { color: #58a6ff; }
    .ds-executed { color: #3fb950; }
    .ds-rejected { color: #8b949e; }
    .ds-failed   { color: #f85149; }

    .btn {
      background: #21262d; border: 1px solid #30363d; border-radius: 6px;
      color: #c9d1d9; padding: 6px 16px; font-size: 0.82rem; cursor: pointer;
    }
    .btn:hover { background: #30363d; }
    .btn-sm { padding: 4px 10px; font-size: 0.75rem; }
    .btn-execute { background: #1f3d2f; color: #7ee787; }
    .btn-reject  { background: #3d1f2f; color: #ff7b72; }

    .loading { text-align: center; padding: 40px; color: #8b949e; }
    .loading i { font-size: 1.5rem; }
    .empty { text-align: center; padding: 40px; color: #8b949e; }
    .empty i { font-size: 2rem; display: block; margin-bottom: 8px; }

    .modal-overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); z-index:100; align-items:center; justify-content:center; }
    .modal-overlay.visible { display: flex; }
    .modal { background: #161b22; border:1px solid #30363d; border-radius:12px; padding:24px; max-width:700px; width:90%; max-height:80vh; overflow-y:auto; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom:16px; }
    .modal-header h3 { font-size:1.1rem; }
    .modal-close { background:none; border:none; color:#8b949e; font-size:1.2rem; cursor:pointer; }
    .modal-close:hover { color:#f85149; }
    .modal-info-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:0.82rem; }
    .modal-info-grid .label { color:#8b949e; }
    .modal-info-grid .value { color:#e1e4e8; font-family:monospace; font-size:0.8rem; }
    .preview { font-family:monospace; font-size:0.75rem; color:#8b949e; background:#0f1117; padding:8px; border-radius:6px; max-height:200px; overflow-y:auto; white-space:pre-wrap; }

    .policy-tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:0.7rem; font-weight:500; margin:2px; }
    .policy-degraded { background:#3d1f2f; color:#ff7b72; }
    .policy-broken   { background:#3d1f2f; color:#f85149; }

    @media (max-width:768px) { .cards { grid-template-columns:repeat(2,1fr); } }
    .filters { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:16px; align-items:center; }
    .filters select { background:#161b22; border:1px solid #30363d; border-radius:6px; color:#e1e4e8; padding:6px 12px; font-size:0.85rem; outline:none; }
    .filters select:focus { border-color:#58a6ff; }
  </style>
</head>
<body>
  <div class="app">
    <a class="back" href="/">&larr; Dashboard</a>
    <h1><i class="fas fa-brain"></i> Meta Decision Center</h1>
    <p class="subtitle">Autonomous decisions, policy state, and manual intervention</p>

    <div class="cards" id="stats-cards">
      <div class="card"><div class="label">Proposed</div><div class="value blue" id="stat-proposed">...</div></div>
      <div class="card"><div class="label">Executed</div><div class="value green" id="stat-executed">...</div></div>
      <div class="card"><div class="label">Rejected</div><div class="value gray" id="stat-rejected" style="color:#8b949e">...</div></div>
      <div class="card"><div class="label">Degraded</div><div class="value red" id="stat-degraded">...</div></div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2><i class="fas fa-shield"></i> Policy State</h2>
      </div>
      <div id="policy-state" style="padding:12px;font-size:0.85rem">
        <div class="loading"><i class="fas fa-spinner fa-spin"></i></div>
      </div>
    </div>

    <div class="filters">
      <label>Status
        <select id="filter-status">
          <option value="">all</option>
          <option value="proposed">proposed</option>
          <option value="executed">executed</option>
          <option value="rejected">rejected</option>
        </select>
      </label>
      <label>Type
        <select id="filter-type">
          <option value="">all</option>
          <option value="switch_policy">switch_policy</option>
          <option value="redispatch">redispatch</option>
          <option value="degrade">degrade</option>
          <option value="scale_agent">scale_agent</option>
        </select>
      </label>
      <button class="btn" onclick="loadDecisions()"><i class="fas fa-sync"></i> Refresh</button>
      <button class="btn" onclick="evaluateNow()"><i class="fas fa-play"></i> Evaluate Now</button>
    </div>

    <div class="section">
      <div class="section-header">
        <h2><i class="fas fa-list"></i> Decision Log</h2>
      </div>
      <table>
        <thead><tr>
          <th>Type</th><th>Status</th><th>Target</th><th>Reasoning</th><th>Confidence</th><th>Time</th><th>Actions</th>
        </tr></thead>
        <tbody id="decisions-body">
          <tr><td colspan="7" class="loading"><i class="fas fa-spinner fa-spin"></i></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Decision Detail</h3>
        <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    function apiUrl(p) { const t=new URL(location.href).searchParams.get('token')||''; return p+(p.includes('?')?'&':'?')+'token='+encodeURIComponent(t); }
    function escapeHtml(s) { if(!s)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    async function loadDecisions() {
      const tb = document.getElementById('decisions-body');
      tb.innerHTML = '<tr><td colspan="7" class="loading"><i class="fas fa-spinner fa-spin"></i></td></tr>';

      const status = document.getElementById('filter-status').value;
      const dType = document.getElementById('filter-type').value;
      let url = '/api/meta-decisions?limit=200';
      if (status) url += '&status=' + encodeURIComponent(status);
      if (dType) url += '&decisionType=' + encodeURIComponent(dType);

      try {
        const resp = await fetch(apiUrl(url));
        if (!resp.ok) throw new Error(resp.statusText);
        const decisions = await resp.json();
        renderDecisions(decisions);
        renderStats(decisions);
      } catch (err) {
        tb.innerHTML = '<tr><td colspan="7" class="empty"><i class="fas fa-exclamation-triangle"></i>' + escapeHtml(err.message) + '</td></tr>';
      }

      // Load policy state
      try {
        const psResp = await fetch(apiUrl('/api/meta-decisions/policy-state'));
        if (psResp.ok) {
          const ps = await psResp.json();
          renderPolicyState(ps);
        }
      } catch {}
    }

    function renderDecisions(decisions) {
      const tb = document.getElementById('decisions-body');
      if (decisions.length === 0) {
        tb.innerHTML = '<tr><td colspan="7" class="empty"><i class="fas fa-inbox"></i>No decisions</td></tr>';
        return;
      }
      tb.innerHTML = decisions.map(d => {
        const dtClass = 'dt-' + d.decisionType;
        const dsClass = 'ds-' + d.status;
        const time = d.createdAtMs ? new Date(d.createdAtMs).toLocaleString('zh-CN',{hour12:false}) : '-';
        const reasoningShort = d.reasoningText.length > 60 ? escapeHtml(d.reasoningText.slice(0,60)) + '…' : escapeHtml(d.reasoningText);
        const actionsHtml = d.status === 'proposed'
          ? '<button class="btn btn-sm btn-execute" onclick="executeDecision(\'' + d.decisionId + '\',event)"><i class="fas fa-check"></i></button> '
          + '<button class="btn btn-sm btn-reject" onclick="rejectDecision(\'' + d.decisionId + '\',event)"><i class="fas fa-times"></i></button>'
          : '<span style="color:#484f58">—</span>';
        return '<tr>'
          + '<td><span class="dtag ' + dtClass + '">' + escapeHtml(d.decisionType) + '</span></td>'
          + '<td><span class="dstatus ' + dsClass + '"><i class="fas fa-circle"></i> ' + escapeHtml(d.status) + '</span></td>'
          + '<td style="font-family:monospace;font-size:0.78rem">' + escapeHtml(d.targetComponent) + '</td>'
          + '<td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + escapeHtml(d.reasoningText) + '">' + reasoningShort + '</td>'
          + '<td>' + (d.confidenceScore * 100).toFixed(0) + '%</td>'
          + '<td style="font-size:0.75rem;color:#8b949e;white-space:nowrap">' + time + '</td>'
          + '<td>' + actionsHtml + '</td>'
          + '</tr>';
      }).join('');
    }

    function renderStats(decisions) {
      const proposed = decisions.filter(d => d.status === 'proposed').length;
      const executed = decisions.filter(d => d.status === 'executed').length;
      const rejected = decisions.filter(d => d.status === 'rejected').length;
      document.getElementById('stat-proposed').textContent = proposed;
      document.getElementById('stat-executed').textContent = executed;
      document.getElementById('stat-rejected').textContent = rejected;
    }

    function renderPolicyState(ps) {
      const el = document.getElementById('policy-state');
      let html = '<div style="display:flex;flex-wrap:wrap;gap:12px">';
      html += '<span>Last evaluated: ' + (ps.lastEvaluatedAtMs ? new Date(ps.lastEvaluatedAtMs).toLocaleString() : 'never') + '</span>';
      html += '</div><div style="margin-top:8px">';
      if (ps.degradedComponents && ps.degradedComponents.length > 0) {
        html += '<strong style="color:#f85149">Degraded: </strong>';
        html += ps.degradedComponents.map(c => '<span class="policy-tag policy-degraded">' + escapeHtml(c) + '</span>').join('');
      } else {
        html += '<span style="color:#3fb950"><i class="fas fa-check-circle"></i> No degraded components</span>';
      }
      html += '</div><div style="margin-top:8px">';
      if (ps.activeDecisions && ps.activeDecisions.length > 0) {
        html += '<strong>Active decisions: </strong>' + ps.activeDecisions.length;
        html += '<div style="margin-top:4px;font-size:0.78rem">' + ps.activeDecisions.map(d =>
          '<span style="color:#58a6ff">' + escapeHtml(d.decisionType) + '</span> on <span style="font-family:monospace">' + escapeHtml(d.targetComponent) + '</span>'
        ).join('<br>') + '</div>';
      }
      html += '</div>';
      el.innerHTML = html;
    }

    async function evaluateNow() {
      document.getElementById('decisions-body').innerHTML = '<tr><td colspan="7" class="loading"><i class="fas fa-spinner fa-pulse"></i> Evaluating...</td></tr>';
      try {
        const resp = await fetch(apiUrl('/api/meta-decisions/evaluate'), { method: 'POST' });
        if (!resp.ok) throw new Error(resp.statusText);
        const result = await resp.json();
        loadDecisions();
      } catch (err) {
        document.getElementById('decisions-body').innerHTML = '<tr><td colspan="7" class="empty"><i class="fas fa-exclamation-triangle"></i>' + escapeHtml(err.message) + '</td></tr>';
      }
    }

    async function executeDecision(id, event) {
      if (event) event.stopPropagation();
      try {
        await fetch(apiUrl('/api/meta-decisions/' + encodeURIComponent(id) + '/execute'), { method: 'POST' });
        loadDecisions();
      } catch (err) { alert('Failed: ' + err.message); }
    }

    async function rejectDecision(id, event) {
      if (event) event.stopPropagation();
      try {
        await fetch(apiUrl('/api/meta-decisions/' + encodeURIComponent(id) + '/reject'), { method: 'POST' });
        loadDecisions();
      } catch (err) { alert('Failed: ' + err.message); }
    }

    loadDecisions();
  </script>
</body>
</html>
