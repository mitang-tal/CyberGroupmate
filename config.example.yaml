# CyberGroupmate 配置文件示例
# 复制为 config.yaml 后修改使用
# 所有配置项都可以通过环境变量覆盖

# ─── LLM Profiles ───
# 定义多个 LLM 配置 profile，每个 profile 有独立的 provider/key/model
# 在 model_tiers 中通过名称引用
llm_profiles:
  # 示例：Google Gemini
  gemini-flash:
    provider: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key: ""           # 或通过 LLM_API_KEY 环境变量设置
    model: gemini-3-flash-preview
    temperature: 0.7
    max_tokens: 8192

  gemini-pro:
    provider: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key: ""
    model: gemini-3.1-pro-preview
    temperature: 1
    max_tokens: 8192
    thinking_level: medium  # none | low | medium | high（Gemini 特有）

  # 示例：Anthropic Claude
  # claude:
  #   provider: anthropic
  #   base_url: https://api.anthropic.com/v1
  #   api_key: ""
  #   model: claude-sonnet-4-20250514
  #   temperature: 0.7
  #   max_tokens: 4096

  # 示例：OpenAI
  # openai:
  #   provider: openai
  #   base_url: https://api.openai.com/v1
  #   api_key: ""
  #   model: gpt-4o
  #   temperature: 0.7
  #   max_tokens: 4096

  # 示例：Moonshot (OpenAI 兼容)
  # moonshot:
  #   provider: openai
  #   base_url: https://api.moonshot.ai/v1
  #   api_key: ""
  #   model: kimi-k2.5
  #   temperature: 1
  #   max_tokens: 8192

# ─── 模型层级 ───
# 引用上方 profile 名称，不同场景使用不同层级的模型
model_tiers:
  # cheap — 后台分析：话题聚类、Triage、quickTriage
  cheap: gemini-flash
  # mid — 一般介入：问答、知识补充、事实纠正
  mid: gemini-flash
  # sota — 复杂场景：直接 @ 复杂问题、冲突调解
  sota: gemini-pro
  # vision — 未来扩展 (图片理解)
  # vision: gemini-pro

# ─── 人格设置 ───
persona:
  # Agent 的名字
  name: 赛博群友

  # 人格描述（注入到 system prompt 中）
  description: |
    你是一个友好、幽默的群友。你喜欢二次元、技术和有趣的话题。
    你说话风格轻松随意，偶尔会用一些网络梗。
    你有自己的观点和偏好，不会无脑附和。

# ─── 通知唤醒设置 ───
notification:
  # 触发紧急响应的词汇匹配列表
  urgent_words:
    - "@赛博群友"
    - "？"
    - "?"
    - "呢"
    - "吗"

# ─── Telegram 设置 ───
telegram:
  # 连接模式: "bot" | "userbot"
  mode: bot
  # Bot Token (bot 模式下使用，也可通过 TG_BOT_TOKEN 环境变量设置)
  bot_token: ""
  # API ID (userbot 模式下使用，也可通过 TG_API_ID 环境变量设置)
  api_id: ""
  # API Hash (userbot 模式下使用，也可通过 TG_API_HASH 环境变量设置)
  api_hash: ""
  # 手机号 (userbot 模式下使用，也可通过 TG_PHONE 环境变量设置)
  phone: ""
