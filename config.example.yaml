# CyberGroupmate 配置文件示例
# 复制为 config.yaml 后修改使用
# 所有配置项都可以通过环境变量覆盖

# ─── LLM Profiles ───
# 定义多个 LLM 配置 profile，每个 profile 有独立的 provider/key/model
# 在 model_tiers 中通过名称引用
llm_profiles:
  # 示例：Google Gemini
  gemini-flash:
    provider: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key: ""           # 或通过 LLM_API_KEY 环境变量设置
    model: gemini-3-flash-preview
    temperature: 0.7
    max_tokens: 8192

  gemini-pro:
    provider: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key: ""
    model: gemini-3.1-pro-preview
    temperature: 1
    max_tokens: 8192
    thinking_level: medium  # none | low | medium | high（Gemini 特有）

  # 示例：Anthropic Claude
  # claude:
  #   provider: anthropic
  #   base_url: https://api.anthropic.com/v1
  #   api_key: ""
  #   model: claude-sonnet-4-20250514
  #   temperature: 0.7
  #   max_tokens: 4096

  # 示例：OpenAI
  # openai:
  #   provider: openai
  #   base_url: https://api.openai.com/v1
  #   api_key: ""
  #   model: gpt-4o
  #   temperature: 0.7
  #   max_tokens: 4096

  # 示例：Moonshot (OpenAI 兼容)
  # moonshot:
  #   provider: openai
  #   base_url: https://api.moonshot.ai/v1
  #   api_key: ""
  #   model: kimi-k2.5
  #   temperature: 1
  #   max_tokens: 8192

# ─── 模型层级 ───
# 引用上方 profile 名称，不同场景使用不同层级的模型
model_tiers:
  # cheap — 后台分析：话题聚类、Triage、quickTriage
  cheap: gemini-flash
  # mid — 一般介入：问答、知识补充、事实纠正
  mid: gemini-flash
  # sota — 复杂场景：直接 @ 复杂问题、冲突调解
  sota: gemini-pro
  # vision — 未来扩展 (图片理解)
  # vision: gemini-pro

# ─── 人格设置 ───
persona:
  # Agent 的名字
  name: 赛博群友

  # 人格描述（注入到 system prompt 中）
  description: |
    你是一个友好、幽默的群友。你喜欢二次元、技术和有趣的话题。
    你说话风格轻松随意，偶尔会用一些网络梗。
    你有自己的观点和偏好，不会无脑附和。

# ─── 通知唤醒设置 ───
notification:
  # 触发紧急响应的词汇匹配列表
  urgent_words:
    - "@赛博群友"
    - "？"
    - "?"
    - "呢"
    - "吗"

# ─── Telegram 设置 ───
telegram:
  # 连接模式: "bot" | "userbot"
  mode: bot
  # Bot Token (bot 模式下使用，也可通过 TG_BOT_TOKEN 环境变量设置)
  bot_token: ""
  # API ID (userbot 模式下使用，也可通过 TG_API_ID 环境变量设置)
  api_id: ""
  # API Hash (userbot 模式下使用，也可通过 TG_API_HASH 环境变量设置)
  api_hash: ""
  # 手机号 (userbot 模式下使用，也可通过 TG_PHONE 环境变量设置)
  phone: ""

# ─── Reflection 设置 ───
# 控制反思引擎的行为参数
reflection:
  # LLM 生成温度（较低保证稳定性）
  temperature: 0.3

  # 最大输出 token 数（活跃群可能需要更大）
  max_tokens: 16384

  # 覆盖模型名称（默认使用 cheap tier 模型）
  # model: gemini-3-flash-preview

  # 冷场触发阈值（秒），群沉默多久后自动触发反思
  silence_threshold: 7200    # 2h

  # 最大反思间隔（秒），即使群一直活跃也至少每此间隔反思一次
  max_interval: 86400        # 24h

  # 冷场检查间隔（秒），多久检测一次是否冷场
  check_interval: 300        # 5min

  # 渐进合并阈值（天）
  merge_thresholds:
    episode_to_week: 7       # >7天的 episode → week
    week_to_month: 30        # >30天的 week → month
    month_to_quarter: 90     # >90天的 month → quarter
    quarter_to_year: 365     # >365天的 quarter → year

  # 邦巴分层精度限制（按 Tier）
  tier_limits:
    1:                        # Tier 1 (5人): 亲密圈
      max_traits: 10
      max_interests: 15
      episode_days: 14
    2:                        # Tier 2 (15人): 好友圈
      max_traits: 6
      max_interests: 10
      episode_days: 7
    3:                        # Tier 3 (50人): 社交圈
      max_traits: 3
      max_interests: 5
      episode_days: 3
    4:                        # Tier 4 (150人): 认识
      max_traits: 1
      max_interests: 2
      episode_days: 1

  # 作息时间 [起始小时, 结束小时]（24h 格式），在此范围外触发"睡前反思"
  # awake_hours: [8, 24]

  # 作息时间的时区（默认使用系统时区）
  # timezone: "Asia/Shanghai"
