# CyberGroupmate 配置文件
# 所有配置项都可以通过环境变量覆盖

# ─── LLM 设置 ───
llm:
  # API 版本: "openai" | "anthropic"
  # 环境变量: LLM_PROVIDER
  provider: openai

  # API 地址
  # 环境变量: LLM_BASE_URL
  # OpenAI: https://api.openai.com/v1
  # Anthropic: https://api.anthropic.com/v1
  # Moonshot: https://api.moonshot.ai/v1
  base_url: https://api.moonshot.ai/v1

  # API Key
  # 环境变量: LLM_API_KEY (推荐用环境变量而非写在配置文件中)
  api_key: ""

  # 模型名称
  # 环境变量: LLM_MODEL
  model: kimi-k2.5

  # 温度参数 (0.0-1.0)
  # 环境变量: LLM_TEMPERATURE
  temperature: 1

  # 最大输出 token 数
  # 环境变量: LLM_MAX_TOKENS
  max_tokens: 8192

# ─── 人格设置 ───
persona:
  # Agent 的名字
  name: 赛博群友

  # 人格描述（注入到 system prompt 中）
  description: |
    你是一个友好、幽默的群友。你喜欢二次元、技术和有趣的话题。
    你说话风格轻松随意，偶尔会用一些网络梗。
    你有自己的观点和偏好，不会无脑附和。

# ─── Telegram 设置 ───
telegram:
  # 连接模式: "bot" | "userbot"
  mode: bot
  # Bot Token (bot 模式下使用，也可通过 TG_BOT_TOKEN 环境变量设置)
  bot_token: ""
  # API ID (userbot 模式下使用，也可通过 TG_API_ID 环境变量设置)
  api_id: ""
  # API Hash (userbot 模式下使用，也可通过 TG_API_HASH 环境变量设置)
  api_hash: ""
  # 手机号 (userbot 模式下使用，也可通过 TG_PHONE 环境变量设置)
  phone: ""
